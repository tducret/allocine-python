[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "allocine"
dynamic = ["version"]
description = "Non official Python wrapper for allocine.fr"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thibault Ducret", email = "hello@tducret.com" },
]
keywords = [
    "allocine",
    "api",
    "parser",
    "parsing",
    "python-wrapper",
    "scraper",
    "scraping",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "backoff>=2.2.1",
    "click>=8.5.0",
    "diskcache>=5.6,<6",
    "httpx2>=2.13.1",
    "jmespath>=1.1.0",
    "parsel>=1.10.0",
    "platformdirs>=4.3",
    "rich>=14.2.0",
]

[project.optional-dependencies]
dev = [
    "freezegun>=1.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "syrupy>=6.1.1",
    "ty>=0.0.84",
    "vcrpy>=8.3.0",
]

[project.urls]
Homepage = "https://github.com/tducret/allocine-python"

[project.scripts]
seances = "allocine.cli:main"

[tool.setuptools.packages.find]
include = ["allocine*"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty]
